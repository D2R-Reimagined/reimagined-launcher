name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v"
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Create GitHub App token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.D2RR_GH_APP_ID }}
          private-key: ${{ secrets.D2RR_GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}

      - name: Resolve release version
        id: release_version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ github.event.inputs.version }}'.Trim()
          } else {
            $version = '${{ github.ref_name }}'.Trim()
          }

          if ($version.StartsWith('v')) {
            $version = $version.Substring(1)
          }

          if ($version -notmatch '^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "Invalid version format: $version"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Update project version
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $projectFile = 'ReimaginedLauncher/ReimaginedLauncher.csproj'
          $version = '${{ steps.release_version.outputs.version }}'
          $content = Get-Content -Path $projectFile -Raw

          if ($content -notmatch '<Version>[^<]+</Version>') {
            throw "Unable to find <Version> in $projectFile"
          }

          $updated = [regex]::Replace($content, '<Version>[^<]+</Version>', "<Version>$version</Version>", 1)
          Set-Content -Path $projectFile -Value $updated

      - name: Resolve Velopack version
        id: velopack_version
        shell: pwsh
        run: |
          $projectFile = 'ReimaginedLauncher/ReimaginedLauncher.csproj'
          $content = Get-Content -Path $projectFile -Raw

          if ($content -notmatch '<VelopackVersion>([^<]+)</VelopackVersion>') {
            throw "Unable to find <VelopackVersion> in $projectFile"
          }

          $velopackVersion = $Matches[1].Trim()

          "version=$velopackVersion" >> $env:GITHUB_OUTPUT

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore Windows target
        run: dotnet restore ReimaginedLauncher.sln -p:Configuration=Production -r win-x64

      - name: Build Windows target
        run: dotnet build ReimaginedLauncher/ReimaginedLauncher.csproj --configuration Production --runtime win-x64 --no-restore

      - name: Publish Windows production bundle
        run: >
          dotnet publish ReimaginedLauncher/ReimaginedLauncher.csproj
          --configuration Production
          --no-build
          -r win-x64
          --output "${{ github.workspace }}\artifacts\ReimaginedLauncher\win-x64"

      - name: Verify Windows runtime icons
        shell: pwsh
        run: |
          $publishDirectory = '${{ github.workspace }}\artifacts\ReimaginedLauncher\win-x64'
          foreach ($relativePath in @('Assets\ReimaginedLauncher.ico', 'Assets\ReimaginedLauncherDesktop.ico')) {
            $path = Join-Path $publishDirectory $relativePath
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required runtime icon is missing from the Windows publish output: $relativePath"
            }
          }

      - name: Restore Linux target
        run: dotnet restore ReimaginedLauncher.sln -p:Configuration=Production -r linux-x64

      - name: Build Linux target
        run: dotnet build ReimaginedLauncher/ReimaginedLauncher.csproj --configuration Production --runtime linux-x64 --no-restore

      - name: Publish Linux production bundle
        run: >
          dotnet publish ReimaginedLauncher/ReimaginedLauncher.csproj
          --configuration Production
          --no-build
          -r linux-x64
          --output "${{ github.workspace }}\artifacts\ReimaginedLauncher\linux-x64"

      - name: Verify Linux runtime icons
        shell: pwsh
        run: |
          $publishDirectory = '${{ github.workspace }}\artifacts\ReimaginedLauncher\linux-x64'
          foreach ($relativePath in @('Assets/ReimaginedLauncher.ico', 'Assets/ReimaginedLauncherDesktop.ico')) {
            $path = Join-Path $publishDirectory $relativePath
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required runtime icon is missing from the Linux publish output: $relativePath"
            }
          }

      - name: Download previous Windows Velopack releases
        continue-on-error: true
        shell: pwsh
        run: |
          dnx "vpk@${{ steps.velopack_version.outputs.version }}" --allow-roll-forward -- --yes download github `
            --channel "win" `
            --repoUrl "https://github.com/${{ github.repository }}" `
            --token "${{ steps.app_token.outputs.token }}" `
            --outputDir "${{ github.workspace }}\artifacts\velopack\win-x64"

      - name: Download previous Linux Velopack releases
        continue-on-error: true
        shell: pwsh
        run: |
          dnx "vpk@${{ steps.velopack_version.outputs.version }}" --allow-roll-forward -- '[linux]' --yes download github `
            --channel "linux" `
            --repoUrl "https://github.com/${{ github.repository }}" `
            --token "${{ steps.app_token.outputs.token }}" `
            --outputDir "${{ github.workspace }}\artifacts\velopack\linux-x64"

      - name: Collect Windows binaries for SignPath
        if: vars.SIGNPATH_SIGNING_POLICY_SLUG != ''
        shell: pwsh
        env:
          SIGNPATH_HOOK_MODE: Collect
          SIGNPATH_HOOK_WORKDIR: ${{ github.workspace }}\artifacts\signpath
        run: |
          $workDir = $env:SIGNPATH_HOOK_WORKDIR

          dnx "vpk@${{ steps.velopack_version.outputs.version }}" --allow-roll-forward -- --yes pack `
            --packId "D2RReimagined.ReimaginedLauncher" `
            --packVersion "${{ steps.release_version.outputs.version }}" `
            --packDir "${{ github.workspace }}\artifacts\ReimaginedLauncher\win-x64" `
            --mainExe "ReimaginedLauncher.exe" `
            --packTitle "D2R Reimagined Launcher" `
            --packAuthors "D2R Reimagined" `
            --icon "ReimaginedLauncher/Assets/ReimaginedLauncherDesktop.ico" `
            --runtime "win-x64" `
            --channel "win" `
            --noInst `
            --noPortable `
            --delta "None" `
            --signTemplate "pwsh -NoProfile -File .github\scripts\Invoke-VelopackSignPathHook.ps1 {{file...}}" `
            --outputDir "$workDir\collect-out"

          $collected = @(Get-ChildItem -LiteralPath "$workDir\unsigned" -File -Filter '*.exe')
          if ($collected.Count -ne 3) {
            $names = ($collected | ForEach-Object { $_.Name }) -join ', '
            throw "Expected 3 Windows executables for SignPath (app, Squirrel.exe, execution stub), found $($collected.Count): $names"
          }

      - name: Upload unsigned Windows binaries
        id: upload_unsigned_win_binaries
        if: vars.SIGNPATH_SIGNING_POLICY_SLUG != ''
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-win-binaries
          path: ${{ github.workspace }}\artifacts\signpath\unsigned\*.exe
          retention-days: 1

      - name: Sign Windows binaries
        if: vars.SIGNPATH_SIGNING_POLICY_SLUG != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: f16414f6-32df-4874-a376-940734695369
          project-slug: reimagined-launcher
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || 'initial' }}
          github-artifact-id: ${{ steps.upload_unsigned_win_binaries.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ github.workspace }}\artifacts\signpath\signed

      - name: Package Windows Velopack release (signed)
        if: vars.SIGNPATH_SIGNING_POLICY_SLUG != ''
        shell: pwsh
        env:
          SIGNPATH_HOOK_MODE: Apply
          SIGNPATH_HOOK_WORKDIR: ${{ github.workspace }}\artifacts\signpath
        run: |
          $workDir = $env:SIGNPATH_HOOK_WORKDIR

          dnx "vpk@${{ steps.velopack_version.outputs.version }}" --allow-roll-forward -- --yes pack `
            --packId "D2RReimagined.ReimaginedLauncher" `
            --packVersion "${{ steps.release_version.outputs.version }}" `
            --packDir "${{ github.workspace }}\artifacts\ReimaginedLauncher\win-x64" `
            --mainExe "ReimaginedLauncher.exe" `
            --packTitle "D2R Reimagined Launcher" `
            --packAuthors "D2R Reimagined" `
            --icon "ReimaginedLauncher/Assets/ReimaginedLauncherDesktop.ico" `
            --runtime "win-x64" `
            --channel "win" `
            --signTemplate "pwsh -NoProfile -File .github\scripts\Invoke-VelopackSignPathHook.ps1 {{file...}}" `
            --outputDir "${{ github.workspace }}\artifacts\velopack\win-x64"

          Copy-Item `
            -LiteralPath "$workDir\signed\ReimaginedLauncher.exe" `
            -Destination '${{ github.workspace }}\artifacts\ReimaginedLauncher\win-x64\ReimaginedLauncher.exe' `
            -Force

      - name: Package Windows Velopack release (unsigned)
        if: vars.SIGNPATH_SIGNING_POLICY_SLUG == ''
        shell: pwsh
        run: |
          dnx "vpk@${{ steps.velopack_version.outputs.version }}" --allow-roll-forward -- --yes pack `
            --packId "D2RReimagined.ReimaginedLauncher" `
            --packVersion "${{ steps.release_version.outputs.version }}" `
            --packDir "${{ github.workspace }}\artifacts\ReimaginedLauncher\win-x64" `
            --mainExe "ReimaginedLauncher.exe" `
            --packTitle "D2R Reimagined Launcher" `
            --packAuthors "D2R Reimagined" `
            --icon "ReimaginedLauncher/Assets/ReimaginedLauncherDesktop.ico" `
            --runtime "win-x64" `
            --channel "win" `
            --outputDir "${{ github.workspace }}\artifacts\velopack\win-x64"

      - name: Upload unsigned Windows installer
        id: upload_unsigned_setup
        if: vars.SIGNPATH_SIGNING_POLICY_SLUG != ''
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-win-setup
          path: ${{ github.workspace }}\artifacts\velopack\win-x64\*-Setup.exe
          retention-days: 1

      - name: Sign Windows installer
        if: vars.SIGNPATH_SIGNING_POLICY_SLUG != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: f16414f6-32df-4874-a376-940734695369
          project-slug: reimagined-launcher
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || 'initial' }}
          github-artifact-id: ${{ steps.upload_unsigned_setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ github.workspace }}\artifacts\signed\setup-win-x64

      - name: Replace Windows installer with signed copy
        if: vars.SIGNPATH_SIGNING_POLICY_SLUG != ''
        shell: pwsh
        run: |
          $setupFiles = @(Get-ChildItem -Path '${{ github.workspace }}\artifacts\velopack\win-x64\*-Setup.exe' -File)
          $signedFiles = @(Get-ChildItem -LiteralPath '${{ github.workspace }}\artifacts\signed\setup-win-x64' -File)
          if ($setupFiles.Count -ne 1 -or $signedFiles.Count -ne 1) {
            throw "Expected exactly one installer and one signed installer, found $($setupFiles.Count) and $($signedFiles.Count)"
          }

          Copy-Item -LiteralPath $signedFiles[0].FullName -Destination $setupFiles[0].FullName -Force

      - name: Verify Windows Authenticode signatures
        if: vars.SIGNPATH_SIGNING_POLICY_SLUG != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Assert-Signed {
            param([string]$Path)
            $sig = Get-AuthenticodeSignature -LiteralPath $Path
            if (-not $sig.SignerCertificate -or $sig.Status -notin @('Valid', 'UnknownError')) {
              throw "Expected valid Authenticode signature on '$Path', but status was $($sig.Status)."
            }
            Write-Host "Verified signature on $Path ($($sig.SignerCertificate.Subject))"
          }

          Assert-Signed '${{ github.workspace }}\artifacts\ReimaginedLauncher\win-x64\ReimaginedLauncher.exe'

          $setupFiles = @(Get-ChildItem -Path '${{ github.workspace }}\artifacts\velopack\win-x64\*-Setup.exe' -File)
          if ($setupFiles.Count -ne 1) {
            throw "Expected 1 Setup.exe, found $($setupFiles.Count)"
          }
          Assert-Signed $setupFiles[0].FullName

          $nupkgFiles = @(Get-ChildItem -Path '${{ github.workspace }}\artifacts\velopack\win-x64\*-full.nupkg' -File | Sort-Object LastWriteTime -Descending)
          $currentNupkg = $nupkgFiles | Where-Object { $_.Name -like "*-${{ steps.release_version.outputs.version }}-full.nupkg" } | Select-Object -First 1
          if (-not $currentNupkg) {
            throw "Could not find full nupkg for version ${{ steps.release_version.outputs.version }}"
          }

          $verifyDir = '${{ github.workspace }}\artifacts\signpath\verify-nupkg'
          if (Test-Path -LiteralPath $verifyDir) {
            Remove-Item -LiteralPath $verifyDir -Recurse -Force
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::ExtractToDirectory($currentNupkg.FullName, $verifyDir)

          $nupkgExes = @(Get-ChildItem -LiteralPath $verifyDir -Recurse -File -Filter '*.exe')
          if ($nupkgExes.Count -ne 3) {
            $names = ($nupkgExes | ForEach-Object { $_.Name }) -join ', '
            throw "Expected 3 executables in $($currentNupkg.Name), found $($nupkgExes.Count): $names"
          }

          foreach ($exe in $nupkgExes) {
            Assert-Signed $exe.FullName
          }

      - name: Package Linux Velopack release
        shell: pwsh
        run: |
          dnx "vpk@${{ steps.velopack_version.outputs.version }}" --allow-roll-forward -- '[linux]' --yes pack `
            --packId "D2RReimagined.ReimaginedLauncher" `
            --packVersion "${{ steps.release_version.outputs.version }}" `
            --packDir "${{ github.workspace }}\artifacts\ReimaginedLauncher\linux-x64" `
            --mainExe "ReimaginedLauncher" `
            --packTitle "D2R Reimagined Launcher" `
            --packAuthors "D2R Reimagined" `
            --icon "ReimaginedLauncher/Assets/ReimaginedLauncherDesktop.png" `
            --runtime "linux-x64" `
            --channel "linux" `
            --categories "Game;Utility" `
            --outputDir "${{ github.workspace }}\artifacts\velopack\linux-x64"

      - name: Commit version update
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ReimaginedLauncher/ReimaginedLauncher.csproj

          if (git diff --cached --quiet) {
            Write-Host "Project version already matches ${{ steps.release_version.outputs.version }}"
            exit 0
          }

          git commit -m "chore(release): ${{ steps.release_version.outputs.tag }}"
          git push origin HEAD:${{ github.ref_name }}

      - name: Create release tag
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $tag = '${{ steps.release_version.outputs.tag }}'

          git show-ref --verify --quiet "refs/tags/$tag"
          if ($LASTEXITCODE -eq 0) {
            throw "Tag $tag already exists"
          }

          git tag $tag
          git push origin $tag

      - name: Create release zip
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "${{ github.workspace }}\artifacts\ReimaginedLauncher\win-x64\*" `
            -DestinationPath "${{ github.workspace }}\artifacts\ReimaginedLauncher-${{ steps.release_version.outputs.tag }}-win-x64.zip" `
            -Force

      - name: Generate release notes
        id: release_notes
        shell: pwsh
        run: |
          $outputPath = "${{ github.workspace }}\artifacts\release-notes.md"
          ./.github/scripts/Generate-ReleaseNotes.ps1 `
            -CurrentTag '${{ steps.release_version.outputs.tag }}' `
            -OutputPath $outputPath

          $content = Get-Content -Path $outputPath -Raw
          "body<<EOF" >> $env:GITHUB_OUTPUT
          $content >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ReimaginedLauncher-${{ steps.release_version.outputs.tag }}-win-x64
          path: ${{ github.workspace }}\artifacts\ReimaginedLauncher\win-x64

      - name: Upload Linux release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ReimaginedLauncher-${{ steps.release_version.outputs.tag }}-linux-x64
          path: ${{ github.workspace }}\artifacts\ReimaginedLauncher\linux-x64

      - name: Upload Windows Velopack artifact
        uses: actions/upload-artifact@v7
        with:
          name: ReimaginedLauncher-${{ steps.release_version.outputs.tag }}-velopack-win-x64
          path: ${{ github.workspace }}\artifacts\velopack\win-x64

      - name: Upload Linux Velopack artifact
        uses: actions/upload-artifact@v7
        with:
          name: ReimaginedLauncher-${{ steps.release_version.outputs.tag }}-velopack-linux-x64
          path: ${{ github.workspace }}\artifacts\velopack\linux-x64

      - name: Upload Windows Velopack release assets
        shell: pwsh
        run: |
          $arguments = @(
            'vpk@${{ steps.velopack_version.outputs.version }}',
            '--allow-roll-forward',
            '--',
            '--yes',
            'upload', 'github',
            '--channel', 'win',
            '--outputDir', '${{ github.workspace }}\artifacts\velopack\win-x64',
            '--repoUrl', 'https://github.com/${{ github.repository }}',
            '--token', '${{ steps.app_token.outputs.token }}',
            '--publish',
            '--merge',
            '--releaseName', '${{ steps.release_version.outputs.tag }}',
            '--tag', '${{ steps.release_version.outputs.tag }}'
          )

          & dnx @arguments

      - name: Upload Linux Velopack release assets
        shell: pwsh
        run: |
          $arguments = @(
            'vpk@${{ steps.velopack_version.outputs.version }}',
            '--allow-roll-forward',
            '--',
            '[linux]',
            '--yes',
            'upload', 'github',
            '--channel', 'linux',
            '--outputDir', '${{ github.workspace }}\artifacts\velopack\linux-x64',
            '--repoUrl', 'https://github.com/${{ github.repository }}',
            '--token', '${{ steps.app_token.outputs.token }}',
            '--publish',
            '--merge',
            '--releaseName', '${{ steps.release_version.outputs.tag }}',
            '--tag', '${{ steps.release_version.outputs.tag }}'
          )

          & dnx @arguments

      - name: Upload downloads to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ steps.app_token.outputs.token }}
          tag_name: ${{ steps.release_version.outputs.tag }}
          name: ${{ steps.release_version.outputs.tag }}
          body: ${{ steps.release_notes.outputs.body }}
          overwrite_files: true
          files: |
            ${{ github.workspace }}\artifacts\ReimaginedLauncher-${{ steps.release_version.outputs.tag }}-win-x64.zip
            ${{ github.workspace }}\artifacts\velopack\linux-x64\*.AppImage
